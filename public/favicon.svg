    <path d="M 140 372 L 140 140 C 140 128 152 120 162 126 L 196 146 C 202 150 206 156 206 164 L 206 372 C 206 382 194 388 186 382 L 150 360 C 144 356 140 350 140 342 Z" fill="url(#nesto-grad)" />
    
    <!-- Diagonal Dynamic Wave -->
